[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "focus-signal-lab"
version = "0.1.0"
description = "A reproducible temporal ML benchmark for Brazil's inflation expectations"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2", "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
focus-lab = "focus_signal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
